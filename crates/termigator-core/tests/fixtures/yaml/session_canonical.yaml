- label: quotes 'single' and "double"
  host: host-with-#hash.example.test
  user: '  leading and trailing  '
  port: 0
  group: 'a: b'
  password: '#not a comment'
  identity_file: ''
  extra_ssh_args: '-L 9000:localhost:9000 # forward'
  remote_command: echo 'it''s' && printf "%s\n" "$HOME"
  notes: "tab\there, backslash \\ and bell \a and nel \N end"
  tags: []
  request_tty: null
- label: A very long label that goes well past the eighty column limit of PyYAML emitter
    width
  host: 2001:db8::1
  user: u
  port: 65535
  protocol: rdp
  domain: EXAMPLE
  resolution: 1920x1080
  shared_folders:
  - /home/user/Shared Folder With Spaces
  - /tmp
  fullscreen: true
  multimon: false
  notes: averyveryveryveryveryveryveryveryveryveryveryveryveryveryveryveryveryveryveryverylongwordwithoutspaces
  description: Ten opis jest bardzo długi i zawiera polskie znaki ąćęłńóśźż oraz emoji
    🚀 żeby sprawdzić zawijanie wierszy przez emiter
- label: serial-console
  protocol: serial
  device: /dev/ttyUSB0
  baud: 115200
  parity: none
  stop_bits: 1
  flow: none
  port: -1
  ratio: 0.5
  big: 12345678901234567
  tiny: 1.0e-07
  huge: 1.0e+17
  neg_zero: -0.0
  groups:
    nested:
      deeper:
      - 1
      - - 2
        - 3
      - k: v
      empty_map: {}
      empty_list: []
- label: telnet-router
  protocol: telnet
  host: router.example.test
  port: 23
  group: Network/Routers/Core
  user: null
  password: null
  vnc_password: '- dash start'
  x: '? question'
  y: ': colon start'
  z: '@at'
  w: '`backtick'
  v: '%percent'
  u: '!bang'
  t: '&amp'
  s: '*star'
  r: '|pipe'
  q: '>gt'
  p: '[bracket'
  o: '{brace'
  m: comma, inside
  l: 'trailing colon:'
  k: '--- document'
  j: '... end'
