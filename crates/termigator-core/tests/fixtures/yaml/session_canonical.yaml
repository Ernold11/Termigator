# Termigator SSH connections — edited by the app or by hand.
- label: web-01
  host: web-01.example.test
  user: deploy
  port: 22
  terminal: embedded
  group: Production/Web
  protocol: ssh
  password: enc:v1:QUFBQUFBQUFBQUFBQUFBQS1ub3QtYS1yZWFsLXNlYWxlZC1wYXNzd29yZC1qdXN0LWEtZml4dHVyZQ==
  identity_file: ~/.ssh/id_ed25519_fixture
  extra_ssh_args: -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o
    ServerAliveCountMax=4 -C
  local_forwards:
  - 8080:localhost:80
  - 15432:db.internal.test:5432
  remote_forwards: []
  dynamic_forward: '1080'
  forward_agent: true
  compression: false
  tags:
  - prod
  - web
  - nginx
- label: Serwer główny – Łódź (zażółć gęślą jaźń)
