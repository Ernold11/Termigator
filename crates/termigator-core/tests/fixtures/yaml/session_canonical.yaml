  port: 2222
  group: Biuro/Łódź/Piętro 2
  password: hunter2-fixture
  jump_host: bastion@198.51.100.7:2200
  startup_commands:
  - cd /srv/app
  - export LANG=pl_PL.UTF-8
  - tmux attach || tmux
  notes: "Line one\nLine two: with colon\n\n  indented line\ntrailing spaces   "
