[package]
name = "termigator"
description = "Termigator desktop application: QML UI over termigator-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# The code generated by #[cxx_qt::bridge] expands to #[cxx::bridge].
cxx = "1.0.176"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
# QApplication (widgets) lives here, not in cxx-qt-lib.
cxx-qt-lib-extras = "=0.10.0"
termigator-core = { path = "../termigator-core" }
# KGlobalAccel "Show / hide Termigator" and the Wayland activation token.
termigator-term-bridge = { path = "../termigator-term-bridge" }
serde_json = "1"

[dev-dependencies]
termigator-core = { path = "../termigator-core" }

[build-dependencies]
cxx-qt-build = "=0.10.0"
# QResourceFile (alias for a file outside the crate) for the embedded logo in the QML resources.
qt-build-utils = "=0.10.0"

# Windows: DPAPI (CryptProtectData) for the password in the .rdp file mstsc opens (rdp_windows.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects"] }

# Windows: the app icon as a resource of termigator.exe (Explorer, Start menu and desktop shortcuts).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[lints]
workspace = true
