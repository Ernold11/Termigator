name: Feature request
description: An idea for something new or better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could Termigator help?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
