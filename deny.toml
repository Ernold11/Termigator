# cargo-deny: licenses, advisories, bans and sources of the Rust workspace.
# Run: `cargo deny check` (CI job `deny`).

[graph]
all-features = true

[licenses]
# Permissive licenses accepted for dependencies. Termigator itself is MIT and so is the
# terminal engine (ghostty-vt); crates.io dependencies are kept permissive on purpose.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.9
# Narrow, per-crate exceptions (all pulled in by the terminal engine, ghostty-vt), not new
# defaults: option-ext is MPL-2.0 (file-level copyleft; used unmodified, its source is on
# crates.io), webpki-roots / webpki-root-certs are CDLA-Permissive-2.0 certificate data used only by
# the engine's build script (ureq), never linked into the app.
exceptions = [
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]
[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
version = 2
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
